<style>
:root {
  --bg: #ECF0ED;
  --sheet: #F8FAF8;
  --ink: #15302A;
  --muted: #56695F;
  --line: #CBD5CF;
  --control: #FFFFFF;
  --accent: #1D5B45;
  --accent-ink: #FFFFFF;
  --danger: #A8321F;
  --field: #1D5B45;
  --field-deep: #164736;
  --field-ink: #F2F8F4;
  --field-muted: #B8D3C4;
  --lane: rgba(255, 255, 255, 0.34);
  --gold: #E6B43A;
  --silver: #C6D0D4;
  --pass: #8FE3B3;
  --fail: #FF9F8E;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --stencil: "Big Shoulders Stencil Display", "Big Shoulders Display", "Arial Narrow", sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1613; --sheet: #14201C; --ink: #E2ECE6; --muted: #93A69D; --line: #2A3B35; --control: #0F1916;
    --accent: #72C99C; --accent-ink: #0D1613; --danger: #FF9F8E;
    --field: #17473A; --field-deep: #113A2F; --field-muted: #A7C9B7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1613; --sheet: #14201C; --ink: #E2ECE6; --muted: #93A69D; --line: #2A3B35; --control: #0F1916;
  --accent: #72C99C; --accent-ink: #0D1613; --danger: #FF9F8E;
  --field: #17473A; --field-deep: #113A2F; --field-muted: #A7C9B7;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 120px; }
.masthead { margin-bottom: 28px; max-width: 34rem; }
.masthead h1 {
  font: 800 clamp(2.9rem, 9vw, 4.6rem)/0.9 var(--display);
  letter-spacing: 0.005em; margin: 0 0 12px;
}
.masthead p { margin: 0; color: var(--muted); }

.grid { display: grid; gap: 20px; align-items: start; }
@media (min-width: 860px) {
  .grid { grid-template-columns: minmax(0, 1fr) 380px; gap: 32px; }
  .panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); }
  .wrap { padding-top: 48px; padding-bottom: 64px; }
}

/* ---------- input sheet ---------- */
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 8px 20px 20px; }
.block { padding: 18px 0 6px; }
.block + .block { border-top: 1px solid var(--line); margin-top: 10px; }
.block h2 { font: 700 1.6rem/1 var(--display); margin: 0 0 14px; letter-spacing: 0.01em; }
.block > .note { margin: -6px 0 6px; color: var(--muted); font-size: 0.94rem; }
.block > .note.error { color: var(--danger); font-weight: 500; }

.you { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 520px) { .you { grid-template-columns: 1fr 1fr; } }
.field-label { display: block; font-weight: 600; font-size: 0.94rem; margin-bottom: 6px; }
.help { font-size: 0.88rem; color: var(--muted); margin-top: 6px; min-height: 1.3em; }
.help.error { color: var(--danger); font-weight: 500; }

.seg { display: inline-grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--line); border-radius: 12px; padding: 3px; background: var(--control); width: 100%; max-width: 260px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; text-align: center; padding: 8px 10px; border-radius: 9px; font-weight: 600; min-height: 40px; line-height: 24px; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.text-in {
  height: 46px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--control);
  padding: 0 12px; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 1.1rem; width: 100%;
}
.text-in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.text-in[aria-invalid="true"] { border-color: var(--danger); }
.age-in { max-width: 120px; }

/* stations */
.station { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 14px; row-gap: 10px; padding: 16px 0; align-items: center; }
.station + .station { border-top: 1px dashed var(--line); }
.station .name { font-weight: 600; }
.station .unit { display: block; font-size: 0.86rem; color: var(--muted); font-weight: 400; }
.pts { text-align: right; min-width: 64px; }
.pts b { font: 800 2.2rem/0.9 var(--display); font-variant-numeric: tabular-nums; }
.pts small { display: block; font-size: 0.78rem; color: var(--muted); }
.station .controls, .station .help { grid-column: 2 / 4; }
.station .help { margin-top: -4px; }
.station.off .name { color: var(--muted); }
.station.off .controls, .station.off .help { display: none; }
.station.off .pts b { font: 500 0.9rem/1.3 var(--body); color: var(--muted); }

.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 3px; }

.stepper { display: flex; align-items: center; gap: 8px; }
.step {
  width: 46px; height: 46px; flex: none; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--control); font-size: 1.4rem; line-height: 1; cursor: pointer; font-weight: 500;
  display: grid; place-items: center; touch-action: manipulation;
}
.step:hover { border-color: var(--accent); }
.step:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.reps-in { width: 88px; text-align: center; }
.time { display: flex; align-items: center; gap: 4px; }
.time .text-in { width: 58px; text-align: center; padding: 0 6px; }
.time .colon { font: 800 1.6rem/1 var(--display); color: var(--muted); }
.stepper .unit-tag { font-size: 0.86rem; color: var(--muted); }

.actions { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 16px; display: flex; justify-content: flex-end; }
.ghost { border: 1.5px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.ghost:hover { border-color: var(--danger); color: var(--danger); }
.ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- result panel: the infield ---------- */
.panel {
  background: var(--field); color: var(--field-ink); border-radius: 30px; padding: 30px 30px 28px;
  box-shadow: inset 0 0 0 9px var(--field), inset 0 0 0 10.5px var(--lane), inset 0 0 0 17px var(--field), inset 0 0 0 18.5px var(--lane);
}
.panel h2 { font: 600 1.05rem/1.2 var(--body); margin: 8px 0 0 4px; color: var(--field-muted); }
.score { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 0; padding-left: 2px; }
.score .num { font: 800 clamp(6rem, 26vw, 8.4rem)/0.86 var(--stencil); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.score .of { font: 600 1.7rem/1 var(--display); color: var(--field-muted); }
.status { display: flex; align-items: center; gap: 12px; margin: 10px 0 4px 4px; }
.medal { width: 22px; height: 22px; border-radius: 50%; flex: none; background: transparent; box-shadow: inset 0 0 0 2px var(--lane); }
.medal[data-tier="GOLD"] { background: var(--gold); box-shadow: inset 0 0 0 3px rgba(255,255,255,.45), 0 0 0 2px var(--gold); }
.medal[data-tier="SILVER"] { background: var(--silver); box-shadow: inset 0 0 0 3px rgba(255,255,255,.5), 0 0 0 2px var(--silver); }
.medal[data-tier="PASS"] { background: var(--pass); }
.medal[data-tier="FAIL"] { background: var(--fail); }
.tier { font: 800 2.3rem/1 var(--display); letter-spacing: 0.01em; }
.line { margin: 6px 4px 22px; color: var(--field-ink); opacity: .92; min-height: 1.5em; }

.track { margin: 0 4px 6px; }
.lane { position: relative; height: 18px; border-top: 2px solid var(--lane); border-bottom: 2px solid var(--lane); }
.fill { position: absolute; left: 0; top: 3px; bottom: 3px; width: var(--pct, 0%); background: var(--field-ink); border-radius: 0 6px 6px 0; transition: width .35s cubic-bezier(.2,.8,.2,1); }
.fill[data-tier="GOLD"] { background: var(--gold); }
.fill[data-tier="SILVER"] { background: var(--silver); }
.fill[data-tier="FAIL"] { background: var(--fail); }
.tick { position: absolute; top: -8px; bottom: -8px; width: 2px; margin-left: -1px; background: var(--field-ink); }
.tick[data-k="silver"] { background: var(--silver); }
.tick[data-k="gold"] { background: var(--gold); }
.ticklabels { position: relative; height: 22px; margin-top: 10px; font: 600 1rem/1 var(--display); font-variant-numeric: tabular-nums; }
.ticklabels span { position: absolute; transform: translateX(-50%); }
.ticklabels .ends { color: var(--field-muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.84rem; color: var(--field-muted); margin: 6px 4px 20px; }
.legend i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 6px; background: var(--field-ink); }
.legend i[data-k="silver"] { background: var(--silver); height: 3px; }
.legend i[data-k="gold"] { background: var(--gold); height: 3px; }

.breakdown { list-style: none; margin: 0 4px; padding: 0; border-top: 1px solid var(--lane); }
.breakdown li { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--lane); }
.breakdown .lbl { flex: 1; }

  { name: "1 station: 2.4 km run",                     on: [0,0,1,0], pass: 31, award: false },
  { name: "1 station: AAFT",                           on: [0,0,0,1], pass: 31, award: false },
];
const GOLD = 85, SILVER = 75;
const STATION_MAX = { situp: 25, pushup: 25, run: 50, aaft: 50 };

function ageGroup(age) {
  if (age < 22) return 1;
  return Math.min(14, Math.floor((age - 22) / 3) + 2);
}
function ageGroupRange(g) {
  if (g === 1) return "under 22";
  if (g === 14) return "58 and above";
  const lo = 22 + (g - 2) * 3;
  return lo + "–" + (lo + 2);
}
function tableFor(station, gender) {
  return station === "aaft" ? T.aaft : T[station + "_" + gender];
}
function groupFor(station, g) { return station === "aaft" ? Math.min(g, 9) : g; }

// reps: segments [[minReps, pts], ...] ascending
function scoreReps(tab, g, reps) {
  const segs = tab.groups[g - 1];
  const r = Math.min(reps, tab.max);
  let i = 0;
  while (i + 1 < segs.length && segs[i + 1][0] <= r) i++;
  const next = segs[i + 1];
  return { pts: segs[i][1], next: next ? { at: next[0], pts: next[1] } : null };
}
// time: segments [[maxSec, pts], ...] ascending time, descending points
function scoreTime(tab, g, sec) {
  const segs = tab.groups[g - 1];
  const t = Math.min(Math.max(sec, tab.min), tab.max);
  let i = 0;
  while (segs[i][0] < t) i++;
  const next = i > 0 ? segs[i - 1] : null;
  return { pts: segs[i][1], next: next ? { at: next[0], pts: next[1] } : null };
}
function fmtTime(sec) { return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }

const IDS = ["situp", "pushup", "run", "aaft"];
// state: { gender: "M"|"F"|"", age: number|null, on: {situp,pushup,run,aaft}, val: {situp,pushup,run,aaft} (reps or seconds, null if blank) }
function compute(state) {
  const onArr = IDS.map(id => state.on[id] ? 1 : 0);
  const option = OPTIONS.find(o => o.on.every((v, i) => v === onArr[i])) || null;
  const group = state.age != null ? ageGroup(state.age) : null;
  const ready = option && state.gender && group != null;
  const stations = IDS.map(id => {
    const s = { id, taking: !!state.on[id], pts: null, next: null, group: null };
    if (!ready || !s.taking || state.val[id] == null) return s;
    const g = groupFor(id, group), tab = tableFor(id, state.gender);
    const r = (id === "run" || id === "aaft") ? scoreTime(tab, g, state.val[id]) : scoreReps(tab, g, state.val[id]);
    s.pts = r.pts; s.next = r.next; s.group = g;
    return s;
  });
  const taken = stations.filter(s => s.taking);
  const scored = taken.filter(s => s.pts != null);
  const total = scored.length ? scored.reduce((a, s) => a + s.pts, 0) : null;
  const max = taken.reduce((a, s) => a + STATION_MAX[s.id], 0);
  let result = null;
  if (option && total != null) {
    if (scored.length < taken.length) result = "INCOMPLETE";
    else if (total < option.pass) result = "FAIL";
    else if (option.award) result = total >= GOLD ? "GOLD" : total >= SILVER ? "SILVER" : "PASS";
    else result = "PASS";
  }
  return { option, group, ready, stations, total, max, pass: option ? option.pass : null, result,
           missing: taken.filter(s => s.pts == null).map(s => s.id) };
}


// ---------- UI ----------
const NAMES = { situp: "Sit-ups", pushup: "Push-ups", run: "2.4 km run", aaft: "AAFT" };
const UNITS = { situp: "Reps", pushup: "Reps", run: "Minutes and seconds", aaft: "Minutes and seconds" };
const NEEDS = { situp: "sit-up reps", pushup: "push-up reps", run: "2.4 km run time", aaft: "AAFT time" };
const TIME_START = { run: 12 * 60, aaft: 14 * 60 };
const STORE_KEY = "ippt-calculator-v1";
const $ = (id) => document.getElementById(id);

function defaults() {
  return { gender: "", age: "", on: { situp: true, pushup: true, run: true, aaft: false },
           raw: { situp: "", pushup: "", run_m: "", run_s: "", aaft_m: "", aaft_s: "" } };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && s.on && s.raw) return Object.assign(defaults(), s, { on: Object.assign(defaults().on, s.on), raw: Object.assign(defaults().raw, s.raw) });
  } catch (e) {}
  return defaults();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
let state = load();

const isTime = (id) => id === "run" || id === "aaft";
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

function parseWhole(str, min, max) {
  const t = String(str).trim();
  if (t === "") return { v: null };
  if (!/^\d+$/.test(t)) return { v: null, err: true };
  const n = parseInt(t, 10);
  if (n < min || n > max) return { v: null, err: true };
  return { v: n };
}
function parseAge() {
  const r = parseWhole(state.age, 16, 99);
  return r.err ? { v: null, err: "Enter a whole number, 16 or older." } : r;
}
function parseStation(id) {
  if (!isTime(id)) {
    const r = parseWhole(state.raw[id], 0, 999);
    return r.err ? { v: null, err: "Enter a whole number of reps." } : r;
  }
  const mRaw = state.raw[id + "_m"], sRaw = state.raw[id + "_s"];
  const m = parseWhole(mRaw, 0, 99), s = parseWhole(sRaw, 0, 59);
  if (m.v == null && !m.err && s.v == null && !s.err) return { v: null };
  if (m.err) return { v: null, err: "Minutes should be a whole number." };
  if (s.err) return { v: null, err: "Seconds must be 0 to 59." };
  if (m.v == null) return { v: null, err: "Add the minutes too." };
  return { v: m.v * 60 + (s.v || 0) };
}

// ---- build station rows ----
function stationRow(id) {
  const el = document.createElement("div");
  el.className = "station"; el.id = "st-" + id;
  const input = isTime(id)
    ? `<span class="time">
         <input class="text-in" id="${id}-m" inputmode="numeric" autocomplete="off" placeholder="mm" aria-label="${NAMES[id]} minutes" aria-describedby="${id}-help">
         <span class="colon" aria-hidden="true">:</span>
         <input class="text-in" id="${id}-s" inputmode="numeric" autocomplete="off" placeholder="ss" aria-label="${NAMES[id]} seconds" aria-describedby="${id}-help">
       </span>`
    : `<input class="text-in reps-in" id="${id}-in" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="${NAMES[id]} reps" aria-describedby="${id}-help">`;
  const lessLabel = isTime(id) ? "Take 1 second off" : "One rep fewer";
  const moreLabel = isTime(id) ? "Add 1 second" : "One more rep";
  el.innerHTML = `
    <span class="switch"><input type="checkbox" role="switch" id="${id}-on" aria-label="Taking ${NAMES[id]}"><span></span></span>
    <label class="name" for="${isTime(id) ? id + "-m" : id + "-in"}">${NAMES[id]}<span class="unit">${UNITS[id]}</span></label>
    <div class="pts" id="${id}-pts"><b>–</b></div>
    <div class="controls stepper">
      <button class="step" type="button" data-step="-1" aria-label="${lessLabel}">−</button>
      ${input}
      <button class="step" type="button" data-step="1" aria-label="${moreLabel}">+</button>
    </div>
    <div class="help" id="${id}-help"></div>`;
  return el;
}
const stationsEl = $("stations");
IDS.forEach((id) => stationsEl.appendChild(stationRow(id)));

// ---- wire inputs ----
function syncInputs() {
  document.querySelectorAll('input[name="gender"]').forEach((r) => (r.checked = r.value === state.gender));
  $("age").value = state.age;
  IDS.forEach((id) => {
    $(id + "-on").checked = !!state.on[id];
    if (isTime(id)) { $(id + "-m").value = state.raw[id + "_m"]; $(id + "-s").value = state.raw[id + "_s"]; }
    else $(id + "-in").value = state.raw[id];
  });
}
document.querySelectorAll('input[name="gender"]').forEach((r) =>
  r.addEventListener("change", () => { state.gender = r.value; render(); }));
$("age").addEventListener("input", (e) => { state.age = e.target.value; render(); });

IDS.forEach((id) => {
  $(id + "-on").addEventListener("change", (e) => {
    state.on[id] = e.target.checked;
    if (e.target.checked && id === "run") { state.on.aaft = false; $("aaft-on").checked = false; }
    if (e.target.checked && id === "aaft") { state.on.run = false; $("run-on").checked = false; }
    render();
  });
  if (isTime(id)) {
    const mEl = $(id + "-m"), sEl = $(id + "-s");
    mEl.addEventListener("keydown", (e) => {
      if (e.key === "." || e.key === ":") { e.preventDefault(); sEl.focus(); sEl.select(); }
    });
    mEl.addEventListener("input", () => {
      const v = mEl.value, m = v.match(/^\s*(\d*)\s*[.:]\s*(\d*)\s*$/);
      if (m) {
        mEl.value = m[1];
        if (m[2] !== "") { sEl.value = m[2].length === 1 ? m[2] + "0" : m[2].slice(0, 2); }
        state.raw[id + "_s"] = sEl.value;
        sEl.focus();
      }
      state.raw[id + "_m"] = mEl.value; render();
    });
    sEl.addEventListener("input", () => { state.raw[id + "_s"] = sEl.value; render(); });
    sEl.addEventListener("blur", () => {
      if (/^\d$/.test(sEl.value.trim())) { sEl.value = "0" + sEl.value.trim(); state.raw[id + "_s"] = sEl.value; save(); }
    });
  } else {
    $(id + "-in").addEventListener("input", (e) => { state.raw[id] = e.target.value; render(); });
  }
  $("st-" + id).querySelectorAll(".step").forEach((b) =>
    b.addEventListener("click", () => {
      const d = parseInt(b.dataset.step, 10);
      const cur = parseStation(id).v;
      if (isTime(id)) {
        const next = Math.max(0, (cur == null ? TIME_START[id] : cur + d));
        state.raw[id + "_m"] = String(Math.floor(next / 60));
        state.raw[id + "_s"] = String(next % 60).padStart(2, "0");
      } else {
        state.raw[id] = String(Math.max(0, (cur == null ? 0 : cur + d)));
      }
      syncInputs(); render();
    }));
});
$("clear").addEventListener("click", () => { state = defaults(); syncInputs(); render(); $("age").focus(); });

// ---- helpers for hints ----
function bestFor(id, r) {
  const tab = tableFor(id, state.gender), g = groupFor(id, r.group), segs = tab.groups[g - 1];
  return isTime(id) ? { at: segs[0][0], pts: segs[0][1] } : { at: segs[segs.length - 1][0], pts: segs[segs.length - 1][1] };
}
const fmtAt = (id, at) => (isTime(id) ? fmtTime(at) + " or faster" : plural(at, "rep"));
function joinAnd(list) { return list.length < 2 ? list.join("") : list.slice(0, -1).join(", ") + " and " + list[list.length - 1]; }

// ---- render ----
function render() {
  const age = parseAge(), gender = state.gender;
  const parsed = {}; IDS.forEach((id) => (parsed[id] = parseStation(id)));
  const r = compute({ gender, age: age.v, on: state.on, val: Object.fromEntries(IDS.map((id) => [id, parsed[id].v])) });

  // age
  $("age").setAttribute("aria-invalid", age.err ? "true" : "false");
  const ah = $("age-help");
  ah.classList.toggle("error", !!age.err);
  ah.textContent = age.err ? age.err : r.group ? `Age group ${r.group} (${ageGroupRange(r.group)})` : "";

  // stations note
  const note = $("option-note");
  const onCount = IDS.filter((id) => state.on[id]).length;
  if (!r.option) {
    note.classList.add("error");
    note.textContent = onCount === 0 ? "Turn on at least one station." :
      "Sit-ups or push-ups on their own isn't a test option. Add the other one or a run station.";
  } else {
    note.classList.remove("error");
    note.textContent = r.option.award
      ? `Pass mark ${r.option.pass}. Silver from ${SILVER}, Gold from ${GOLD}.`
      : `Pass mark ${r.option.pass}. Gold and Silver are only for sit-ups, push-ups and the 2.4 km run together.`;
  }

  // station rows
  r.stations.forEach((s) => {
    const id = s.id, row = $("st-" + id), p = parsed[id];
    row.classList.toggle("off", !s.taking);
    const inputs = isTime(id) ? [$(id + "-m"), $(id + "-s")] : [$(id + "-in")];
    inputs.forEach((i) => { i.disabled = !s.taking; i.setAttribute("aria-invalid", p.err ? "true" : "false"); });
    row.querySelectorAll(".step").forEach((b) => (b.disabled = !s.taking));
    const ptsEl = $(id + "-pts");
    if (!s.taking) ptsEl.innerHTML = "<b>Not taking</b>";
    else ptsEl.innerHTML = s.pts == null ? "<b>–</b>" : `<b>${s.pts}</b><small>of ${STATION_MAX[id]}</small>`;
    const help = $(id + "-help");
    help.classList.toggle("error", !!p.err);
    let h = "";
    if (p.err) h = p.err;
    else if (s.taking && r.ready) {
      if (s.pts != null) h = s.next ? `${fmtAt(id, s.next.at)} scores ${plural(s.next.pts, "point")}.` : "Maximum points.";
      else { const b = bestFor(id, r); h = `${fmtAt(id, b.at)} scores the full ${b.pts}.`; }
      if (id === "aaft" && r.group > 9) h += " Scored in age group 9, the oldest group in the AAFT table.";
    }
    help.textContent = h;
  });

  // panel
  let tier = "Not scored yet", line = "", tierKey = "";
  if (!r.option) line = "Choose a valid set of stations.";
  else if (!r.ready) line = "Add your gender and age to start scoring.";
  else if (r.total == null) line = "Enter a station result to see your points.";
  else {
    tierKey = r.result;
    const t = r.total;
    if (r.result === "INCOMPLETE") { tier = "Incomplete"; line = `Enter your ${joinAnd(r.missing.map((m) => NEEDS[m]))} to finish.`; }
    else if (r.result === "FAIL") { tier = "Fail"; line = `${plural(r.pass - t, "more point")} to pass.`; }
    else if (r.result === "GOLD") { tier = "Gold"; line = t === GOLD ? "Right on the Gold line." : `${plural(t - GOLD, "point")} above the Gold line.`; }
    else if (r.result === "SILVER") { tier = "Silver"; line = `${plural(GOLD - t, "more point")} for Gold.`; }
    else { tier = "Pass"; line = r.option.award ? `${plural(SILVER - t, "more point")} for Silver.` : `Passed with ${t - r.pass} to spare.`; }
  }
  $("total").textContent = r.total == null ? "–" : r.total;
  $("of").textContent = r.option ? "/ " + r.max : "";
  $("tier").textContent = tier;
  $("medal").dataset.tier = tierKey;
  $("line").textContent = line;

  // track
  const max = r.option ? r.max : 100;
  const pct = r.total == null ? 0 : Math.min(100, (r.total / max) * 100);
  const fill = $("fill"); fill.style.setProperty("--pct", pct + "%"); fill.dataset.tier = tierKey;
  const marks = [];
  if (r.option) {
    marks.push({ k: "pass", v: r.option.pass, name: "Pass" });
    if (r.option.award) { marks.push({ k: "silver", v: SILVER, name: "Silver" }); marks.push({ k: "gold", v: GOLD, name: "Gold" }); }
  }
  $("ticks").innerHTML = marks.map((m) => `<span class="tick" data-k="${m.k}" style="left:${(m.v / max) * 100}%"></span>`).join("");
  $("ticklabels").innerHTML = `<span class="ends" style="left:0;transform:none">0</span>` +
    marks.map((m) => `<span style="left:${(m.v / max) * 100}%">${m.v}</span>`).join("") +
    `<span class="ends" style="left:auto;right:0;transform:none">${max}</span>`;
  $("legend").innerHTML = marks.map((m) => `<span><i data-k="${m.k}"></i>${m.name} ${m.v}</span>`).join("");
  $("track").setAttribute("aria-hidden", "true");

  // breakdown
  $("breakdown").innerHTML = r.stations.filter((s) => s.taking).map((s) =>
    `<li><span class="lbl">${NAMES[s.id]}</span>${s.pts == null ? '<span class="val dim">Not entered</span>' : `<span class="val">${s.pts}</span>`}<span class="cap">/ ${STATION_MAX[s.id]}</span></li>`).join("");

  // dock
  $("d-num").textContent = r.total == null ? "–" : r.total;
  $("d-of").textContent = r.option ? "/" + r.max : "";
  $("d-tier").textContent = tier;
  $("d-line").textContent = line;
  dockWanted = r.total != null;
  updateDock();

  save();
}

// ---- mobile dock visibility ----
let dockWanted = false, panelVisible = false;
function updateDock() { $("dock").hidden = !(dockWanted && !panelVisible); }
try {
  new IntersectionObserver((entries) => { panelVisible = entries[0].isIntersecting; updateDock(); }, { threshold: 0.25 }).observe($("panel"));
} catch (e) {}
$("dock").addEventListener("click", () => {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("panel").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
});

syncInputs();
render();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
